spring:
  application:
    name: hrms-backend

  # Database
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/hrms_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # JPA
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 50
        globally_quoted_identifiers: true

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false   # disabled: V11 checksum differs between environments

  # Mail (Outlook/Office 365)
  mail:
    host: ${MAIL_HOST:smtp.office365.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # Cache
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s

  # Virtual Threads (Java 21 / Project Loom)
  threads:
    virtual:
      enabled: true

# Server
server:
  port: 8081
  servlet:
    context-path: /api
  error:
    include-message: never
    include-binding-errors: never

# JWT
jwt:
  secret: ${JWT_SECRET:hrms-super-secret-key-must-be-at-least-256-bits-long-for-hmac-sha256-algorithm}
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

# MinIO (S3-compatible)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:}
  bucket-name: ${MINIO_BUCKET:hrms-documents}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  region: ${MINIO_REGION:us-east-1}
  presigned-url-expiry-minutes: 15

# File Upload
spring.servlet.multipart:
  enabled: true
  max-file-size: 50MB
  max-request-size: 55MB

# Actuator + Prometheus metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      enabled: true
  health:
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: hrms-backend
      # LOG_LEVEL_APP: DEBUG (dev) → INFO (prod)
logging:
  level:
    com.hrms: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_SQL:DEBUG}

# App custom config
app:
  mail:
    enabled: ${MAIL_ENABLED:false}   # Set true khi đã config SMTP
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:60967,http://localhost:*}

# Document Sync
document-sync:
  enabled: ${DOC_SYNC_ENABLED:true}
  target-type: ${DOC_SYNC_TARGET_TYPE:LOCAL}   # LOCAL | S3_BUCKET
  target-path: ${DOC_SYNC_TARGET_PATH:/data/hrms-sync/}
  backup-bucket: ${DOC_SYNC_BACKUP_BUCKET:hrms-backup}

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    disable-swagger-default-url: true
